[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[project]
name = "pooltool-billiards"
version = "0.0.0"
description = "A sandbox billiards game that emphasizes realistic physics."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "Apache-2.0" }

authors = [
  { name = "Evan Kiefl", email = "kiefl.evan@gmail.com" },
]

maintainers = [
  { name = "Evan Kiefl", email = "kiefl.evan@gmail.com" },
]

keywords = ["simulation", "physics", "pool", "billiards", "panda3d", "snooker", "eight-ball"]

classifiers = [
  "Topic :: Scientific/Engineering :: Visualization",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Games/Entertainment :: Simulation",
]

dependencies = [
  # Platform-specific panda3d, like the Poetry config:
  "panda3d>=1.10.13,<1.11; sys_platform == 'darwin'",
  "panda3d==1.11.0.dev3702; sys_platform == 'linux'",
  "panda3d==1.11.0.dev3702; sys_platform == 'win32'",

  "panda3d-gltf>=1.2.0",
  "panda3d-simplepbr>=0.12.0",

  "numpy>=1.26.0",
  "numba>=0.59.0",
  "llvmlite>=0.44.0",
  "scipy>=1.12.0",

  "attrs>=21.3.0",
  "cattrs>=22.1.0",

  "msgpack>=1.0.0",
  "msgpack-numpy>=0.4.8",

  "pyyaml>=5.2",
  "click>=8.0.0",
  "Pillow>=6.2.0",
  "h5py>=3.10",
  "h11>=0.16.0",
  "rich>=14.0.0,<15.0.0",
  "numpy-quaternion>=2024.0.12",
]

[project.urls]
Homepage = "https://pooltool.readthedocs.io/en/latest/"
Documentation = "https://pooltool.readthedocs.io/en/latest/"
Source = "https://github.com/ekiefl/pooltool"

[project.scripts]
run-pooltool = "pooltool.main:run"

[dependency-groups]
dev = [
  # Testing and formatting
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0,<6.0.0",
  "pre-commit>=3.7.1",
  "pyright>=1.1.373",
  "ruff>=0.5.5",

  # Diagnostics
  "psutil>=6.0.0",
  "ipython>=8.18.1",
  "ipdb>=0.13.13,<0.14.0",
  "pprofile>=2.2.0",

  # Vignettes / notebooks / plotting
  "jupyterlab>=4.0.0",
  "pandas>=2",
  "plotly>=5",
  "matplotlib>=3.8",

  # If you still want Poetry tooling around, you could add:
  # "poetry==1.8.4",
  # "poetry-dynamic-versioning[plugin]>=1.4.0",
]

docs = [
  "sphinx==8.1.3",
  "sphinx-copybutton==0.5.2",
  "furo==2024.8.6",
  "myst-parser==4.0.1",
  "sphinx-autoapi==3.6.0",
  "sphinx-tabs==3.4.7",
  "nbsphinx==0.9.7",
  "sphinx-autobuild==2024.10.3",
  "sphinx-togglebutton==0.3.2",
]

[tool.uv]
# Optional, but nice: always install dev deps on sync
default-groups = ["dev"]

[tool.uv.build-backend]
# Flat layout with top-level "pooltool" package
module-name = "pooltool"
module-root = ""

# Exclude heavy / intermediate assets from sdist/wheel, like original Poetry config
source-exclude = [
  "pooltool/**/test_*",
  "pooltool/**/*.blend*",
  "pooltool/**/*.svg",
  "pooltool/**/*.exr",
  "pooltool/**/*.pptx",
  "pooltool/models/**/*_pbr.glb",
]

wheel-exclude = [
  "pooltool/**/test_*",
  "pooltool/**/*.blend*",
  "pooltool/**/*.svg",
  "pooltool/**/*.exr",
  "pooltool/**/*.pptx",
  "pooltool/models/**/*_pbr.glb",
]

# Use Panda3D archive only for panda3d, on linux/win
[tool.uv.sources]
panda3d = [
  { index = "panda3d-archive", marker = "sys_platform == 'linux'" },
  { index = "panda3d-archive", marker = "sys_platform == 'win32'" },
]

# Panda3D archive index (explicit-only)
[[tool.uv.index]]
name = "panda3d-archive"
url = "https://archive.panda3d.org/simple/"
explicit = true

# TestPyPI index for publishing / explicit use ONLY
[[tool.uv.index]]
name = "pypi-test"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true   # <-- THIS is the critical bit

[tool.jupytext]
formats = "ipynb,py:percent"
notebook_metadata_filter = "all"

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["docs"]

[tool.ruff.lint]
extend-select = ["I", "UP"]
ignore = ["E741"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
